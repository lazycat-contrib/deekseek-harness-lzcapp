version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: deepseek-harness

build:
  run_buildscript: false

images:
  - id: deepseek-harness
    target: service
    service: deepseek-harness
    source: docker.io/1panel/deepseek-harness
    channel: beta
    sort: semver
    tag_regex: '^0\.1\.\d+-rc\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
    continue_if_newer_version: true
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: DeepSeek Harness
    summary: Published automatically from GitHub Actions.
