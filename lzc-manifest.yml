application:
  subdomain: deepseek-harness
  public_path:
    - /
  upstreams:
    # 代理入口 - PROXY_PORT (LAN 入口点)
    - location: /
      backend: http://deepseek-harness:3080/
  injects:
    - id: inject-basic-auth
      on: request
      auth_required: false
      when:
        - /*
      do: |
        ctx.headers.set("Authorization", "Basic " + "{{ printf "%s:%s" .U.proxy_username .U.proxy_password | b64enc }}");
services:
  deepseek-harness:
    # upstream: docker.io/smanx/deepseek-harness:0.1.0-rc.8
    image: docker.1ms.run/smanx/deepseek-harness:0.1.0-rc.8
    environment:
      # DSH 监听端口（容器内 127.0.0.1）
      - DSH_PORT=3079
      # 代理监听端口（入口点）
      - PROXY_PORT=3080
      # Basic Auth 凭证（始终注入，默认值来自设置向导）
      - PROXY_USERNAME={{ .U.proxy_username }}
      - PROXY_PASSWORD={{ .U.proxy_password }}
    binds:
      # 持久化 dsh 数据
      - /lzcapp/var/dsh:/root/.dsh
