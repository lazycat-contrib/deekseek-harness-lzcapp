params:
  - id: proxy_username
    type: string
    name: "Proxy Username"
    description: "Basic Auth username for the proxy. Leave empty to disable authentication."
    default_value: ""
    optional: true

  - id: proxy_password
    type: secret
    name: "Proxy Password"
    description: "Basic Auth password for the proxy. Leave empty to disable authentication."
    default_value: ""
    optional: true

locales:
  zh:
    proxy_username:
      name: 代理用户名
      description: 代理的 Basic Auth 用户名，留空则禁用认证。
    proxy_password:
      name: 代理密码
      description: 代理的 Basic Auth 密码，留空则禁用认证。
  en:
    proxy_username:
      name: "Proxy Username"
      description: "Basic Auth username for the proxy. Leave empty to disable authentication."
    proxy_password:
      name: "Proxy Password"
      description: "Basic Auth password for the proxy. Leave empty to disable authentication."